name: checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  repo-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Manifests agree, hooks exist and are executable, skills carry frontmatter,
      # every link and image resolves, no orphan assets. Stdlib only, no auth.
      - name: Repo integrity
        run: python3 tools/check-repo.py

      # The hooks must survive being run — a broken profile fails silently otherwise,
      # which is exactly how the "hot cache is loaded" claim stayed false for a year.
      - name: SessionStart profiles
        run: |
          set -euo pipefail
          mkdir -p /tmp/probe/.claude/memory /tmp/probe/context/handoffs
          printf '# Hot cache\n\n- [2026-01-01] CANARY-CI\n' > /tmp/probe/.claude/memory/MEMORY.md
          export CLAUDE_PROJECT_DIR=/tmp/probe
          export CLAUDE_PLUGIN_ROOT="$PWD/plugins/memory-kit"
          for src in startup clear fork resume compact; do
            printf '{"session_id":"ci","source":"%s"}' "$src" \
              | python3 "$CLAUDE_PLUGIN_ROOT/hooks/session-start.py" > /tmp/out.json
            # printf, not echo: some shells expand the \n escapes inside the JSON strings
            python3 -c "import json,sys; json.load(open('/tmp/out.json'))['hookSpecificOutput']['additionalContext']" \
              || { echo "invalid hook output for source=$src"; exit 1; }
            case "$src" in
              startup|clear|fork|compact)
                grep -q "CANARY-CI" /tmp/out.json || { echo "source=$src did not inject the hot cache"; exit 1; } ;;
            esac
            echo "  ok: $src"
          done

      # v7: the stats block must surface specs owed ratification and builds left open too
      # long — and must stay silent for a project that has no plans/ at all.
      - name: SessionStart surfaces assumed and stale-building specs
        run: |
          set -euo pipefail
          mkdir -p /tmp/probe/projects/demo/plans /tmp/probe/projects/nospecs
          printf '# demo — assumed\n\n**Created:** 2026-01-01 · **Status:** assumed\n' \
            > /tmp/probe/projects/demo/plans/2026-01-01-old-assumed.md
          printf '# demo — building\n\n**Created:** 2026-01-01 · **Status:** building\n' \
            > /tmp/probe/projects/demo/plans/2026-01-01-old-building.md
          export CLAUDE_PROJECT_DIR=/tmp/probe
          export CLAUDE_PLUGIN_ROOT="$PWD/plugins/memory-kit"
          printf '{"session_id":"ci","source":"startup"}' \
            | python3 "$CLAUDE_PLUGIN_ROOT/hooks/session-start.py" > /tmp/specs.json
          python3 -c "import json; print(json.load(open('/tmp/specs.json'))['hookSpecificOutput']['additionalContext'])" \
            > /tmp/specs.txt
          grep -q '1 spec assumed (owed ratification)' /tmp/specs.txt \
            || { echo "assumed spec not surfaced"; cat /tmp/specs.txt; exit 1; }
          grep -q '1 building > 14 d' /tmp/specs.txt \
            || { echo "stale building spec not surfaced"; cat /tmp/specs.txt; exit 1; }
          grep -q 'projects/nospecs/' /tmp/specs.txt \
            || { echo "a project without plans/ vanished from the stats"; cat /tmp/specs.txt; exit 1; }
          ! grep 'projects/nospecs/' /tmp/specs.txt | grep -qE 'specs? assumed|building >' \
            || { echo "a project without plans/ printed a spec fragment"; cat /tmp/specs.txt; exit 1; }
          rm -rf /tmp/probe/projects
          # 7.0.3: a repo-level docs/plans/ with plain `Status:` headers and dates from file names;
          # prose that mentions a status must not parse as one.
          mkdir -p /tmp/probe/docs/plans
          printf '# c\n\nStatus: assumed · Tier: prototype\n' > /tmp/probe/docs/plans/2026-01-01-c.md
          printf '# d\n\nStatus: building (slice 2)\n' > /tmp/probe/docs/plans/2026-01-02-d.md
          printf '# g\n\nThe old status: building was dropped.\n' > /tmp/probe/docs/plans/2026-01-03-g.md
          printf '{"session_id":"ci","source":"startup"}' \
            | python3 "$CLAUDE_PLUGIN_ROOT/hooks/session-start.py" \
            | python3 -c "import json,sys; print(json.load(sys.stdin)['hookSpecificOutput']['additionalContext'])" \
            > /tmp/specs.txt
          grep -q 'docs/plans/ — 1 spec assumed (owed ratification) · 1 building > 14 d' /tmp/specs.txt \
            || { echo "docs/plans flags wrong"; grep -A2 '## Plans' /tmp/specs.txt; exit 1; }
          rm -rf /tmp/probe/docs
          echo "  ok"

      - name: Never scaffold into a repo that did not ask
        run: |
          set -euo pipefail
          mkdir -p /tmp/virgin && cd /tmp/virgin
          CLAUDE_PROJECT_DIR=/tmp/virgin CLAUDE_PLUGIN_ROOT="$GITHUB_WORKSPACE/plugins/memory-kit" \
            python3 "$GITHUB_WORKSPACE/plugins/memory-kit/hooks/session-start.py" <<< '{"source":"startup"}' >/dev/null
          test -z "$(ls -A /tmp/virgin)" || { echo "the hook created files in an unadopted repo:"; ls -Ra /tmp/virgin; exit 1; }

      # PreCompact must allow a fresh in-cap cache, block a stale one, and name the REAL
      # problem (a cap breach is not "stale") — the reason text is what the agent acts on.
      - name: PreCompact allows fresh, blocks stale, names a cap breach
        run: |
          set -euo pipefail
          export CLAUDE_PROJECT_DIR=/tmp/probe
          H="$PWD/plugins/memory-kit/hooks/pre-compact.sh"
          touch /tmp/probe/.claude/memory/MEMORY.md
          [ "$(printf '{"session_id":"ci"}' | bash "$H")" = "{}" ] || { echo "fresh cache was blocked"; exit 1; }
          touch -d '2024-01-01' /tmp/probe/.claude/memory/MEMORY.md
          printf '{"session_id":"ci"}' | bash "$H" | grep -q '"decision": "block"' || { echo "stale cache was not blocked"; exit 1; }
          python3 -c "open('/tmp/probe/.claude/memory/MEMORY.md','a').write('x'*3100+'\n')"
          touch /tmp/probe/.claude/memory/MEMORY.md
          OUT=$(printf '{"session_id":"ci"}' | bash "$H")
          grep -q 'OVER its caps' <<< "$OUT" || { echo "cap breach not named: $OUT"; exit 1; }
          printf '# Hot cache\n\n- [2026-01-01] CANARY-CI\n' > /tmp/probe/.claude/memory/MEMORY.md
          echo "  ok"

      # The OpenCode shim is JavaScript and CI has no other reason to load Node — so load it:
      # syntax, module resolution from package.json, and the injection itself with a canary.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: OpenCode shim loads and injects
        run: |
          set -euo pipefail
          node --check .opencode/plugins/memory-kit.js
          node --input-type=module -e "
            import path from 'node:path';
            const pkg = JSON.parse((await import('node:fs')).readFileSync('package.json','utf8'));
            const mod = await import(path.resolve(pkg.main));
            const hooks = await mod.default({ directory: '/tmp/probe' });
            const cfg = {}; await hooks.config(cfg);
            if (!cfg.skills.paths.some(p => p.endsWith('plugins/memory-kit/skills'))) throw new Error('skills path not registered');
            const out = { system: [] };
            await hooks['experimental.chat.system.transform']({}, out);
            const text = out.system.join('\n');
            if (!text.includes('CANARY-CI')) throw new Error('hot cache not injected');
            if (!text.includes('The user talks. You write.')) throw new Error('identity.md not injected');
            const virgin = await mod.default({ directory: '/tmp/virgin' });
            const v = { system: [] };
            await virgin['experimental.chat.system.transform']({}, v);
            if (!v.system.join('').includes('not set up in this repository')) throw new Error('virgin repo pointer missing');
            // 7.0.3: a newer memory-audit deferred list is not the session handoff.
            const fs = await import('node:fs');
            fs.writeFileSync('/tmp/probe/context/handoffs/real-2026-01-01.md', 'REAL-HANDOFF');
            fs.writeFileSync('/tmp/probe/context/handoffs/memory-audit-deferred-2026-01-02.md', 'DEFERRED');
            fs.utimesSync('/tmp/probe/context/handoffs/memory-audit-deferred-2026-01-02.md', new Date(), new Date(Date.now() + 60000));
            const h = { system: [] };
            await hooks['experimental.chat.system.transform']({}, h);
            if (!h.system.join('').includes('REAL-HANDOFF')) throw new Error('deferred list injected as the handoff');
            fs.rmSync('/tmp/probe/context/handoffs/real-2026-01-01.md');
            fs.rmSync('/tmp/probe/context/handoffs/memory-audit-deferred-2026-01-02.md');
            console.log('  ok');
          "

      # 7.0.2: a heading named after a session or a date is flagged; provenance in parentheses,
      # the current-state header, a "verified <date>" topic and a fenced `##` line are not.
      # Python hook and OpenCode shim must agree line for line.
      - name: Session-headed blocks flagged, look-alikes left alone (hook + shim)
        run: |
          set -euo pipefail
          python3 - <<'PY'
          open('/tmp/probe/.claude/memory/MEMORY.md', 'w').write(
              '# Hot cache\n\n'
              '## Current state (2026-01-01, end of session 4)\n'   # L3  header
              '## Patterns\n'                                        # L4
              '### s66 (2026-01-01) — a session block\n'             # L5  flagged
              '### Engine track (s37, 2026-01-01)\n'                 # L6  provenance
              '## Findings [2026-01-01] — a dated block\n'           # L7  flagged
              '## Pricing (verified 2026-01-01)\n'                   # L8  topic
              '```bash\n## s12 inside a fence\n```\n'                # L9-11
              '- [2026-01-01] CANARY-CI\n'
          )
          PY
          export CLAUDE_PROJECT_DIR=/tmp/probe
          export CLAUDE_PLUGIN_ROOT="$PWD/plugins/memory-kit"
          printf '{"session_id":"ci","source":"startup"}' \
            | python3 "$CLAUDE_PLUGIN_ROOT/hooks/session-start.py" \
            | python3 -c "import json,sys; print(json.load(sys.stdin)['hookSpecificOutput']['additionalContext'])" \
            > /tmp/blocks.txt
          [ "$(grep -oE '^  - L[0-9]+' /tmp/blocks.txt | tr -d ' -' | paste -sd, -)" = "L5,L7" ] \
            || { echo "hook flagged the wrong headings"; grep -A8 'Session-headed' /tmp/blocks.txt; exit 1; }
          node --input-type=module -e "
            import path from 'node:path';
            const mod = await import(path.resolve('.opencode/plugins/memory-kit.js'));
            const hooks = await mod.default({ directory: '/tmp/probe' });
            const out = { system: [] };
            await hooks['experimental.chat.system.transform']({}, out);
            const got = [...out.system.join('\n').matchAll(/^  - (L\d+):/gm)].map(m => m[1]).join(',');
            if (got !== 'L5,L7') throw new Error('shim flagged ' + got);
          "
          printf '# Hot cache\n\n- [2026-01-01] CANARY-CI\n' > /tmp/probe/.claude/memory/MEMORY.md
          echo "  ok"

      # 7.1: the hook suites run each hook through its EXACT hooks.json command string — the
      # test guard (v2: asks only on a weakening edit), the git guard, the rails nudge, and the
      # permission-probe runner (every `claude -p` must read </dev/null).
      - name: Hook suites through the exact wiring
        run: |
          set -euo pipefail
          unset CMK_ALLOW_TEST_EDITS CMK_GIT_GUARD
          for t in plugins/memory-kit/hooks/tests/test_*.py plugins/memory-kit/scripts/tests/test_*.py; do
            echo "== $t"; python3 "$t"
          done
